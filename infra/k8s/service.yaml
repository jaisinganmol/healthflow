apiVersion: v1
kind: Service
metadata:
  name: healthflow-ai
  namespace: healthflow
  labels:
    app.kubernetes.io/name: healthflow-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: healthflow-ai
---
apiVersion: v1
kind: Service
metadata:
  name: healthflow-ai-active
  namespace: healthflow
  labels:
    app.kubernetes.io/name: healthflow-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app.kubernetes.io/name: healthflow-ai
---
apiVersion: v1
kind: Service
metadata:
  name: healthflow-ai-preview
  namespace: healthflow
  labels:
    app.kubernetes.io/name: healthflow-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
  selector:
    app.kubernetes.io/name: healthflow-ai
