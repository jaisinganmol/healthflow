[project]
name = "healthflow-ai"
version = "0.1.0"
description = "Production Orchestration Engine for Hospital Pre-Admission & Post-Discharge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.10",
    "httpx>=0.27.0",
    "cryptography>=42.0.8",
    "twilio>=9.1.2",
    "sqlalchemy>=2.0.31",
    "structlog>=24.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "bandit>=1.7.9",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
